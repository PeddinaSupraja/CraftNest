<div class="container-fluid">

<div class="form-card">

<h2>Add New Product</h2>

<form #f="ngForm" (ngSubmit)="addProduct()">

<div class="row">

<div class="col-md-6 mb-3">

<label>Product Name</label>

<input
type="text"
class="form-control"
name="name"
[(ngModel)]="product.name"
required>

</div>

<div class="col-md-6 mb-3">

<label>Category</label>

<select
class="form-control"
name="category"
[(ngModel)]="product.category">

<option>Home Decor</option>
<option>Pottery</option>
<option>Painting</option>
<option>Jewellery</option>
<option>Wood Craft</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Price</label>

<input
type="number"
class="form-control"
name="price"
[(ngModel)]="product.price">

</div>

<div class="col-md-6 mb-3">

<label>Rating</label>

<input
type="number"
class="form-control"
name="rating"
[(ngModel)]="product.rating">

</div>

<div class="col-md-6 mb-3">

<label>Stock</label>

<input
type="number"
class="form-control"
name="stock"
[(ngModel)]="product.stock">

</div>

<div class="col-md-6 mb-3">

<label>Image URL</label>

<input
type="text"
class="form-control"
name="image"
[(ngModel)]="product.image">

</div>

<div class="col-12 mb-3">

<label>Description</label>

<textarea
rows="5"
class="form-control"
name="description"
[(ngModel)]="product.description">

</textarea>

</div>

<div class="text-end">

<button class="btn btn-primary btn-lg">

<i class="fa-solid fa-plus"></i>

Add Product

</button>

</div>

</div>

</form>

</div>

</div>
